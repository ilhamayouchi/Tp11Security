<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Accueil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h2>Bienvenue</h2>
    <p class="subtitle">
        Connecté en tant que <b sec:authentication="name">utilisateur</b>
    </p>

    <a class="btn" th:href="@{/user/dashboard}">Espace Utilisateur</a>
    <a class="btn btn-admin" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}">Espace Administrateur</a>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn-outline">Se déconnecter</button>
    </form>
</div>
</body>
</html>
